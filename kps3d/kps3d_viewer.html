<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>3D Keypoints Viewer</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#111; color:#eee; font-family:monospace; display:flex; height:100vh; overflow:hidden; }

#canvas-container { position:relative; flex:1; }
canvas { display:block; width:100%; height:100%; }

#overlay {
  position:absolute; top:10px; left:10px;
  background:rgba(0,0,0,0.7); border:1px solid #333; border-radius:6px;
  padding:10px 14px; font-size:12px; line-height:1.9; pointer-events:none; min-width:175px;
}
#overlay h3 { font-size:12px; color:#7df; margin-bottom:4px; border-bottom:1px solid #333; padding-bottom:3px; }
.ar { display:flex; justify-content:space-between; gap:12px; }
.ar span:first-child { color:#999; }
.ar span:last-child  { color:#ffa; font-weight:bold; }

#sidebar {
  width:230px; background:#1a1a1a; border-left:1px solid #333;
  display:flex; flex-direction:column; padding:12px; gap:10px; overflow-y:auto;
}
#sidebar h2 { font-size:13px; color:#7df; border-bottom:1px solid #333; padding-bottom:5px; }
.g  { display:flex; flex-direction:column; gap:5px; }
.g > label, .hint { font-size:11px; color:#777; }
.row { display:flex; gap:5px; }
button {
  flex:1; padding:6px 0; background:#2a2a2a; border:1px solid #444;
  color:#eee; border-radius:4px; cursor:pointer; font-size:12px; font-family:monospace;
}
button:hover { background:#3a3a3a; }
button.on { background:#0066cc; border-color:#0088ff; }
input[type=range]  { width:100%; accent-color:#0088ff; cursor:pointer; }
input[type=number] {
  width:100%; background:#222; border:1px solid #444; color:#eee;
  padding:5px 8px; border-radius:4px; font-family:monospace; font-size:12px;
}
input[type=number]:focus { outline:none; border-color:#0088ff; }
#frame-info { font-size:11px; color:#555; text-align:right; }
.sr { display:flex; align-items:center; gap:5px; font-size:11px; color:#777; }
.sv { color:#ffa; min-width:32px; text-align:right; }
</style>
</head>
<body>

<div id="canvas-container">
  <canvas id="c"></canvas>

  <!-- welcome / file picker -->
  <div id="welcome" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(10,10,10,0.82);pointer-events:all;">
    <div style="font-size:15px;color:#7df;">3D Keypoints Viewer</div>
    <label style="cursor:pointer;padding:10px 24px;background:#0066cc;border:1px solid #0088ff;border-radius:5px;font-size:13px;">
      选择 JSON 文件
      <input id="file-input" type="file" accept=".json" style="display:none">
    </label>
    <div id="welcome-hint" style="font-size:11px;color:#555;">本地 file:// 加载，数据不会上传</div>
  </div>

  <div id="overlay">
    <h3>Joint Angles</h3>
    <div id="angle-list"></div>
  </div>
</div>

<div id="sidebar">
  <h2>3D Keypoints Viewer</h2>

  <div class="g">
    <label>播放控制</label>
    <div class="row">
      <button id="btn-play">&#9654; 播放</button>
      <button id="btn-prev" style="flex:0;padding:6px 10px">&#9664;</button>
      <button id="btn-next" style="flex:0;padding:6px 10px">&#9654;|</button>
    </div>
  </div>

  <div class="g">
    <label>帧进度</label>
    <input type="range" id="frame-slider" min="0" step="1" value="0">
    <div id="frame-info">帧 0 / 0</div>
  </div>

  <div class="g">
    <label>跳转到帧</label>
    <input type="number" id="frame-input" min="0" step="1" value="0">
  </div>

  <div class="g">
    <label>播放速度</label>
    <div class="sr">
      <span>慢</span>
      <input type="range" id="speed-slider" min="1" max="60" value="24" step="1">
      <span>快</span>
      <span class="sv" id="speed-val">24 fps</span>
    </div>
  </div>

  <div class="g">
    <label>视角 · 左键旋转 滚轮缩放 右键平移</label>
    <button id="reset-cam">重置视角</button>
  </div>

  <div class="g">
    <label>显示选项</label>
    <div class="row">
      <button id="btn-bones"  class="on">骨骼</button>
      <button id="btn-points" class="on">关键点</button>
      <button id="btn-grid"   class="on">网格</button>
      <button id="btn-angles" class="on">角度</button>
    </div>
    <div class="row">
      <button id="btn-axes">坐标轴</button>
    </div>
  </div>
</div>

<script>
// ── Schema ────────────────────────────────────────────────────────────────
// BONES: [child, parent, group]  group: 0=spine 1=r-arm 2=l-arm 3=r-leg 4=l-leg
const BONES = [
  [0,3,0],[3,6,0],[6,9,0],[9,12,0],[12,15,0],
  [9,13,1],[13,16,1],[16,18,1],[18,20,1],[20,22,1],
  [9,14,2],[14,17,2],[17,19,2],[19,21,2],[21,23,2],
  [0,1,3],[1,4,3],[4,7,3],[7,10,3],
  [0,2,4],[2,5,4],[5,8,4],[8,11,4],
];
const BONE_CLR = ['#d4b800','#4da6ff','#ff7733','#33cc66','#cc44cc'];

// ANGLES: [label, kpA, kpVertex, kpB]
const ANGLES = [
  ['R-Elbow',   16,18,20], ['L-Elbow',   17,19,21],
  ['R-Knee',     1, 4, 7], ['L-Knee',     2, 5, 8],
  ['R-Shoulder', 9,16,18], ['L-Shoulder', 9,17,19],
  ['R-Hip',      0, 1, 4], ['L-Hip',      0, 2, 5],
  ['Spine',      0, 6,12],
];

// ── State ─────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const CAM0   = { rotX:0.3, rotY:0.5, dist:4, panX:0, panY:0 };
let cam = { ...CAM0 };
let frames=[], nFrames=0, curFrame=0, playing=false, fps=24, accT=0, lastTs=0;
let gridY = 0.7;           // feet level, relative to dataCenter — updated after load
let dataCenter = [0,0,0];  // per-load centroid, keeps person centered at cam origin
const flags = { bones:true, points:true, grid:true, angles:true, axes:false };

// ── Resize ────────────────────────────────────────────────────────────────
function resize() { const c=canvas.parentElement; canvas.width=c.clientWidth; canvas.height=c.clientHeight; }
window.addEventListener('resize', resize); resize();

// ── Math ──────────────────────────────────────────────────────────────────
// Data coord: Y-axis points DOWN (head≈-0.19, feet≈1.2).
// Fix: subtract dataCenter, then use sy = cy + y2*s (no flip, Y-down maps naturally to screen-down).
function project([x,y,z], cx, cy) {
  const px=x-dataCenter[0], py=y-dataCenter[1], pz=z-dataCenter[2];
  const cY=Math.cos(cam.rotY), sY=Math.sin(cam.rotY);
  const x1=px*cY+pz*sY, z1=-px*sY+pz*cY;
  const cX=Math.cos(cam.rotX), sX=Math.sin(cam.rotX);
  const y2=py*cX-z1*sX, z2=py*sX+z1*cX;
  const dz=cam.dist+z2;
  if (dz < 0.01) return null;
  const s=600/dz;
  return { sx:cx+cam.panX+x1*s, sy:cy+cam.panY+y2*s, depth:dz, s };
}

function angleDeg(kps, a, v, b) {
  const [ax,ay,az]=[kps[a][0]-kps[v][0], kps[a][1]-kps[v][1], kps[a][2]-kps[v][2]];
  const [bx,by,bz]=[kps[b][0]-kps[v][0], kps[b][1]-kps[v][1], kps[b][2]-kps[v][2]];
  const la=Math.hypot(ax,ay,az), lb=Math.hypot(bx,by,bz);
  if (la<1e-9||lb<1e-9) return 0;
  return Math.acos(Math.min(1,Math.max(-1,(ax*bx+ay*by+az*bz)/(la*lb))))*180/Math.PI;
}

// ── Render ────────────────────────────────────────────────────────────────
function hexAlpha(hex, a) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a.toFixed(2)})`;
}
// depthAlpha: depth is absolute (cam.dist + rotated_z ≈ 7~8 for this dataset).
// Use a relative formula: slight dimming for far, full brightness for near.
// range clamp [0.55, 1.0] so nothing becomes too dark.
function depthAlpha(depth, refDepth) {
  return Math.min(1, Math.max(0.55, 1 + (refDepth - depth) * 0.12));
}

// 网格线逐段投影，避免端点落在near plane后方导致整条线消隐
function drawGridLine(x0, z0, x1, z1, cx, cy) {
  const N=16, gy=gridY;
  let prev=null;
  for (let i=0; i<=N; i++) {
    const t=i/N;
    const p=project([x0+(x1-x0)*t, gy, z0+(z1-z0)*t], cx, cy);
    if (p && prev) { ctx.beginPath(); ctx.moveTo(prev.sx,prev.sy); ctx.lineTo(p.sx,p.sy); ctx.stroke(); }
    prev=p;
  }
}

function drawAxes(cx, cy, len = 0.5) {
  const O = [0, 0, 0];
  const axes = [
    { p: [len, 0,   0  ], color: '#ff3333', label: 'X' },
    { p: [0,   len, 0  ], color: '#33ff44', label: 'Y' },
    { p: [0,   0,   len], color: '#3399ff', label: 'Z' },
  ];
  const o = project(O, cx, cy);
  if (!o) return;
  ctx.save();
  axes.forEach(({ p, color, label }) => {
    const ep = project(p, cx, cy);
    if (!ep) return;
    const dx = ep.sx - o.sx, dy = ep.sy - o.sy;
    if (Math.hypot(dx, dy) < 1) return;
    ctx.beginPath(); ctx.moveTo(o.sx, o.sy); ctx.lineTo(ep.sx, ep.sy);
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
    const a = Math.atan2(dy, dx), al = 10;
    ctx.beginPath();
    ctx.moveTo(ep.sx, ep.sy);
    ctx.lineTo(ep.sx - al * Math.cos(a - 0.4), ep.sy - al * Math.sin(a - 0.4));
    ctx.lineTo(ep.sx - al * Math.cos(a + 0.4), ep.sy - al * Math.sin(a + 0.4));
    ctx.closePath(); ctx.fillStyle = color; ctx.fill();
    ctx.fillStyle = color; ctx.font = 'bold 13px monospace';
    ctx.fillText(label, ep.sx + 5, ep.sy + 4);
  });
  ctx.restore();
}

function drawGrid(cx, cy, ref) {
  ctx.strokeStyle='rgba(100,140,180,0.75)'; ctx.lineWidth=1;
  const gs=0.4, gn=14;        // 更密、更大范围的网格
  const ext=gn*gs;
  for (let i=-gn; i<=gn; i++) {
    drawGridLine(i*gs,-ext, i*gs, ext, cx,cy); // 平行于Z轴
    drawGridLine(-ext,i*gs,  ext,i*gs, cx,cy); // 平行于X轴
  }
}

function drawBones(kps, cx, cy, ref) {
  BONES.forEach(([ci,pi,g]) => {
    const pc=project(kps[ci],cx,cy), pp=project(kps[pi],cx,cy);
    if (!pc||!pp) return;
    const a=depthAlpha((pc.depth+pp.depth)/2, ref);
    ctx.beginPath(); ctx.moveTo(pc.sx,pc.sy); ctx.lineTo(pp.sx,pp.sy);
    ctx.strokeStyle=hexAlpha(BONE_CLR[g],a);
    ctx.lineWidth=Math.min(6,Math.max(2,pc.s*0.016));
    ctx.stroke();
  });
}

function drawPoints(kps, cx, cy, ref) {
  kps.forEach((kp,i) => {
    const p=project(kp,cx,cy); if (!p) return;
    const a=depthAlpha(p.depth, ref), r=Math.min(7,Math.max(3,p.s*0.018));
    ctx.beginPath(); ctx.arc(p.sx,p.sy,r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${a})`; ctx.fill();
    ctx.fillStyle=`rgba(180,225,255,${a})`;
    ctx.font=`${Math.min(12,Math.max(10,p.s*0.012))}px monospace`;
    ctx.fillText(i, p.sx+r+2, p.sy+3);
  });
}

function draw() {
  const W=canvas.width, H=canvas.height, cx=W/2, cy=H/2;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#111'; ctx.fillRect(0,0,W,H);

  const kps=frames[curFrame]; if (!kps) return;

  // reference depth: average of all projected keypoint depths for relative alpha
  const projs = kps.map(kp=>project(kp,cx,cy)).filter(Boolean);
  const refDepth = projs.reduce((s,p)=>s+p.depth,0) / projs.length;

  if (flags.grid)   drawGrid(cx,cy,refDepth);
  if (flags.axes)   drawAxes(cx,cy);
  if (flags.bones)  drawBones(kps,cx,cy,refDepth);

  // overlay 面板始终显示；flags.angles 只控制人身上的canvas标注
  const computed = ANGLES.map(([label,a,v,b]) => [label, v, angleDeg(kps,a,v,b)]);
  document.getElementById('angle-list').innerHTML = computed.map(
    ([label,,deg]) => `<div class="ar"><span>${label}</span><span>${deg.toFixed(1)}°</span></div>`
  ).join('');
  if (flags.angles) {
    ctx.font='11px monospace';
    computed.forEach(([,v,deg]) => {
      const p=project(kps[v],cx,cy); if (!p) return;
      ctx.fillStyle=`rgba(255,230,60,${depthAlpha(p.depth,refDepth)})`;
      ctx.fillText(`${deg.toFixed(0)}°`, p.sx+8, p.sy-5);
    });
  }

  if (flags.points) drawPoints(kps,cx,cy,refDepth);
}

// ── Loop ──────────────────────────────────────────────────────────────────
function loop(ts) {
  requestAnimationFrame(loop);
  const dt=ts-lastTs; lastTs=ts;
  if (playing && nFrames>0) {
    accT+=dt;
    const iv=1000/fps;
    if (accT>=iv) { accT%=iv; curFrame=(curFrame+1)%nFrames; syncUI(); }
  }
  draw();
}

// ── UI sync ───────────────────────────────────────────────────────────────
function syncUI() {
  document.getElementById('frame-slider').value = curFrame;
  document.getElementById('frame-input').value  = curFrame;
  document.getElementById('frame-info').textContent = `帧 ${curFrame} / ${nFrames-1}`;
}

function setFrame(v) {
  curFrame = Math.max(0, Math.min(nFrames-1, v|0));
  syncUI();
}

// ── Events ────────────────────────────────────────────────────────────────
document.getElementById('btn-play').addEventListener('click', () => {
  playing=!playing;
  document.getElementById('btn-play').textContent = playing ? '⏸ 暂停' : '▶ 播放';
  document.getElementById('btn-play').classList.toggle('on', playing);
});
document.getElementById('btn-prev').addEventListener('click', ()=>setFrame(curFrame-1));
document.getElementById('btn-next').addEventListener('click', ()=>setFrame(curFrame+1));
document.getElementById('frame-slider').addEventListener('input', e=>setFrame(+e.target.value));
document.getElementById('frame-input').addEventListener('change', e=>setFrame(+e.target.value));
document.getElementById('speed-slider').addEventListener('input', e=>{
  fps=+e.target.value;
  document.getElementById('speed-val').textContent=`${fps} fps`;
});
document.getElementById('reset-cam').addEventListener('click', ()=>{ cam={...CAM0}; });

// toggle buttons — generic
[['btn-bones','bones'],['btn-points','points'],['btn-grid','grid'],['btn-angles','angles'],['btn-axes','axes']].forEach(([id,key])=>{
  document.getElementById(id).addEventListener('click', e=>{
    flags[key]=!flags[key]; e.target.classList.toggle('on',flags[key]);
  });
});

// Mouse
let drag={active:false,btn:0,lx:0,ly:0};
canvas.addEventListener('mousedown', e=>{ drag={active:true,btn:e.button,lx:e.clientX,ly:e.clientY}; });
window.addEventListener('mouseup', ()=>{ drag.active=false; });
window.addEventListener('mousemove', e=>{
  if (!drag.active) return;
  const dx=e.clientX-drag.lx, dy=e.clientY-drag.ly; drag.lx=e.clientX; drag.ly=e.clientY;
  if (drag.btn===0) {
    cam.rotY-=dx*0.008; cam.rotX+=dy*0.008;
    cam.rotX=Math.max(-Math.PI/2, Math.min(Math.PI/2, cam.rotX));
  } else { cam.panX+=dx; cam.panY+=dy; }
});
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  cam.dist=Math.max(0.5,Math.min(20, cam.dist*(1+e.deltaY*0.001)));
},{passive:false});
canvas.addEventListener('contextmenu', e=>e.preventDefault());

// Keyboard
window.addEventListener('keydown', e=>{
  if (e.target.tagName==='INPUT') return;
  if (e.code==='Space') { e.preventDefault(); document.getElementById('btn-play').click(); }
  else if (e.code==='ArrowLeft')  setFrame(curFrame-1);
  else if (e.code==='ArrowRight') setFrame(curFrame+1);
});

// ── Load ──────────────────────────────────────────────────────────────────
function initData(data) {
  frames=data.frames; nFrames=frames.length;
  const f0=frames[0], n=f0.length;
  // centroid of first frame — keeps person at camera origin, panX/panY = pure mouse offset
  dataCenter=[
    f0.reduce((s,kp)=>s+kp[0],0)/n,
    f0.reduce((s,kp)=>s+kp[1],0)/n,
    f0.reduce((s,kp)=>s+kp[2],0)/n,
  ];
  // gridY in centered coords: average of both ankles & feet + small margin
  gridY=[7,8,10,11].reduce((s,i)=>s+f0[i][1],0)/4+0.05 - dataCenter[1];
  cam={ ...CAM0 }; // reset camera so person is centered on every new load
  document.getElementById('frame-slider').max=nFrames-1;
  document.getElementById('frame-input').max=nFrames-1;
  document.getElementById('welcome').style.display='none';
  syncUI();
}

document.getElementById('file-input').addEventListener('change', e=>{
  const file=e.target.files[0]; if (!file) return;
  document.getElementById('welcome-hint').textContent='解析中...';
  const reader=new FileReader();
  reader.onload=evt=>{ try { initData(JSON.parse(evt.target.result)); } catch(_) { alert('JSON 解析失败'); } };
  reader.readAsText(file);
});

// start render loop immediately so grid is visible before data loads
requestAnimationFrame(ts=>{ lastTs=ts; loop(ts); });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>SMPL Viewer</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#1a1f2a; color:#eee; font-family:monospace; overflow:hidden; }
  body { display:flex; }
  #canvas-container {
    position:relative; flex:1;
    background:#0f1216;     /* letterbox bar color */
    overflow:hidden;
    min-width:0; min-height:0;
  }
  /* Canvas is positioned absolutely, centered, sized to fit the container
     while keeping the (rotated) image aspect via JS-computed pixel dims.
     CSS aspect-ratio + max-width/max-height didn't fill the container
     reliably across browsers; explicit pixel sizing in resize() is robust. */
  canvas {
    display:block;
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%, -50%);
  }
  #status { position:absolute; top:8px; left:8px; background:rgba(0,0,0,0.55);
            padding:5px 9px; font-size:11px; color:#aaa; pointer-events:none; }
  #angle-panel { position:absolute; top:8px; right:8px; background:rgba(0,0,0,0.7);
                 border:1px solid #333; border-radius:4px; padding:8px 10px;
                 font-size:11px; line-height:1.6; min-width:160px; pointer-events:none; }
  #angle-panel h3 { color:#7df; font-size:11px; margin-bottom:3px;
                    border-bottom:1px solid #333; padding-bottom:2px; }
  .ar { display:flex; justify-content:space-between; gap:10px; }
  .ar span:first-child { color:#999; }
  .ar span:last-child { color:#ffa; }

  #sidebar { width:260px; background:#1a1a1a; border-left:1px solid #333;
             display:flex; flex-direction:column; padding:10px; gap:10px; overflow-y:auto; }
  #sidebar h2 { font-size:12px; color:#7df; border-bottom:1px solid #333; padding-bottom:4px; }
  .g { display:flex; flex-direction:column; gap:4px; }
  .g > label { font-size:10px; color:#888; }
  .row { display:flex; gap:5px; }
  button, select {
    flex:1; padding:5px 8px; background:#2a2a2a; border:1px solid #444;
    color:#eee; border-radius:3px; font:inherit; cursor:pointer;
  }
  button:hover, select:hover { background:#3a3a3a; }
  button.on { background:#0066cc; border-color:#0088ff; }
  input[type=range] { width:100%; accent-color:#0088ff; }
  input[type=number] {
    background:#222; border:1px solid #444; color:#eee;
    padding:3px 5px; border-radius:3px; font:inherit;
    font-size:11px; width:100%;
  }
  input[type=number]:focus { outline:none; border-color:#0088ff; }
  .kgrid { display:grid; grid-template-columns:auto 1fr; gap:3px 6px; align-items:center; }
  .kgrid > label { font-size:10px; color:#999; text-align:right; }
  .ro {
    background:#222; border:1px solid #333; color:#ffa;
    padding:2px 5px; border-radius:3px;
    font: inherit; font-size:11px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  #frame-info { font-size:10px; color:#666; text-align:right; }
</style>
</head>
<body>
<div id="canvas-container">
  <canvas id="c"></canvas>
  <div id="status">loading…</div>
  <div id="angle-panel"><h3>Joint Angles</h3><div id="angle-list"></div></div>
</div>
<div id="sidebar">
  <h2>SMPL Viewer</h2>

  <div class="g">
    <label>序列</label>
    <select id="seq-select"></select>
  </div>

  <div class="g">
    <label>相机模式</label>
    <div class="row">
      <button id="btn-mode-3d" class="on">3D 自由</button>
      <button id="btn-mode-2d">2D 对齐</button>
    </div>
    <div class="row">
      <button id="btn-rot-ccw">↶ 左90°</button>
      <button id="btn-rot-cw">↷ 右90°</button>
      <button id="btn-rot-reset" style="flex:0;padding:5px 9px">⟲</button>
    </div>
  </div>

  <div class="g">
    <label>底网</label>
    <div class="row" style="align-items:center">
      <label style="font-size:10px;color:#888;width:36px">范围</label>
      <input type="number" id="grid-size" step="1" min="1" max="500" value="20" style="flex:1">
      <label style="font-size:10px;color:#888;width:36px">间隔</label>
      <input type="number" id="grid-step" step="0.1" min="0.1" max="50" value="0.5" style="flex:1">
    </div>
  </div>

  <div class="g">
    <label>播放</label>
    <div class="row">
      <button id="btn-play">▶ 播放</button>
      <button id="btn-prev" style="flex:0;padding:5px 9px">◀</button>
      <button id="btn-next" style="flex:0;padding:5px 9px">▶|</button>
    </div>
  </div>

  <div class="g">
    <label>帧</label>
    <input type="range" id="frame-slider" min="0" step="1" value="0">
    <div id="frame-info">— / —</div>
  </div>

  <div class="g">
    <label>速度</label>
    <div class="row" style="align-items:center">
      <input type="range" id="speed-slider" min="1" max="60" value="24" step="1">
      <span id="speed-val" style="color:#ffa;min-width:46px;text-align:right">24 fps</span>
    </div>
  </div>

  <div class="g">
    <label>显示</label>
    <div class="row">
      <button id="btn-mesh" class="on">网格</button>
      <button id="btn-points" class="on">关键点</button>
      <button id="btn-bones" class="on">骨骼</button>
    </div>
    <div class="row">
      <button id="btn-grid" class="on">底网</button>
      <button id="btn-axes">轴</button>
      <button id="btn-bg" class="on">底图</button>
    </div>
  </div>

  <div class="g">
    <label>2D 内参 (实时)</label>
    <div class="kgrid">
      <label>fx</label><input type="number" id="k-fx" step="1">
      <label>fy</label><input type="number" id="k-fy" step="1">
      <label>cx</label><input type="number" id="k-cx" step="1">
      <label>cy</label><input type="number" id="k-cy" step="1">
    </div>
    <button id="btn-k-reset" style="font-size:10px;padding:3px 5px;margin-top:3px">重置内参</button>
  </div>

  <div class="g">
    <label>旋后等效 K (只读)</label>
    <div class="kgrid">
      <label>fx</label><span class="ro" id="ek-fx">—</span>
      <label>fy</label><span class="ro" id="ek-fy">—</span>
      <label>cx</label><span class="ro" id="ek-cx">—</span>
      <label>cy</label><span class="ro" id="ek-cy">—</span>
      <label>W×H</label><span class="ro" id="ek-wh">—</span>
    </div>
  </div>

  <div class="g">
    <label>SMPL Root (旋后)</label>
    <div class="kgrid">
      <label>pos</label><span class="ro" id="r-pos">—</span>
      <label>rot</label><span class="ro" id="r-rot">—</span>
      <label>‖rot‖</label><span class="ro" id="r-rotmag">—</span>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": {
    "three": "/smpl_viewer/vendor/three.module.js",
    "three/addons/controls/OrbitControls.js": "/smpl_viewer/vendor/OrbitControls.js"
} }
</script>
<script type="module" src="/viewer.js"></script>
</body>
</html>
